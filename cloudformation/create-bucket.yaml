AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Pictacular Storage Connection ("create a new bucket" mode, issue #149 /
  ADR-0006). Provisions a brand-new private S3 bucket with Pictacular's
  required CORS rule, and an IAM Role that trusts Pictacular's own AWS
  account so its server can call sts:AssumeRole and operate on this bucket
  without ever handling a long-lived access key. Launched once per Storage
  Connection via Pictacular's "Connect your storage" onboarding, which
  pre-fills every parameter below through the Launch Stack URL's query
  string — nothing needs to be typed by hand.

Parameters:
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: >-
      Fixed, per-connection identifier generated and pre-filled by
      Pictacular. Do not edit — this scopes the trust policy below so only
      this specific Storage Connection can assume the created Role.
  AllowedOrigin:
    Type: String
    MinLength: 1
    Description: >-
      Pictacular's own origin (e.g. https://pictacular.app), pre-filled by
      Pictacular, so the created bucket's CORS rule allows the app to load
      images directly from it.
  BucketName:
    Type: String
    MinLength: 1
    Description: >-
      Globally-unique bucket name generated and pre-filled by Pictacular
      (rather than left to CloudFormation's own auto-naming) — Pictacular
      needs to know this name upfront to confirm the connection afterwards
      without asking the User to paste anything back.
  RoleName:
    Type: String
    MinLength: 1
    Description: >-
      Role name generated and pre-filled by Pictacular, for the same
      reason as BucketName above: Pictacular combines this with the AWS
      Account ID the User supplies before launching to predict the
      resulting Role's ARN ahead of time.

Resources:
  StorageConnectionBucket:
    Type: AWS::S3::Bucket
    # Retained on stack deletion/replacement: this bucket holds the User's
    # own photos, so deleting the stack (e.g. disconnecting storage) must
    # never destroy or silently orphan-fail on non-empty bucket contents.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - Id: pictacular-cors
            AllowedHeaders: ['*']
            AllowedMethods: [GET]
            AllowedOrigins: [!Ref AllowedOrigin]
            ExposedHeaders: []
            MaxAge: 3000

  StorageConnectionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              # Pictacular's own AWS account (the STS trust anchor
              # provisioned in issue #148) — see docs/aws-account-setup.md.
              AWS: 'arn:aws:iam::310649435248:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: PictacularStorageConnectionAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Bucket-level actions server/utils/storage.ts performs,
              # scoped to this bucket's own ARN only — never s3:* or an
              # account-wide wildcard.
              - Sid: BucketLevelAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketCors
                  - s3:PutBucketCors
                  - s3:GetBucketLocation
                  - s3:CreateBucket
                Resource: !GetAtt StorageConnectionBucket.Arn
              # Object-level actions, scoped to this bucket's /* object ARN.
              - Sid: ObjectLevelAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${StorageConnectionBucket.Arn}/*'

Outputs:
  RoleArn:
    Description: >-
      The Role Pictacular assumes (via sts:AssumeRole) to operate on this
      Storage Connection's bucket.
    Value: !GetAtt StorageConnectionRole.Arn
  BucketName:
    Description: The newly created bucket's name.
    Value: !Ref StorageConnectionBucket
  BucketRegion:
    Description: >-
      The AWS region the bucket was created in — always the region this
      stack was launched in.
    Value: !Ref AWS::Region
